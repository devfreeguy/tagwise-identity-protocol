[package]
name = "tip_registry"
version = "0.1.0"
description = "TIP tag registry program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "tip_registry"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "1.1.2"

[dev-dependencies]
litesvm = "0.14.0"
solana-message = "4.2.4"
solana-transaction = "4.1.5"
solana-signer = "3.0.1"
solana-keypair = "3.1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
