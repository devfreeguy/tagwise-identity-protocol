name: Deploy production

# Pushes to `main` build apps/api, apps/indexer, and the migrator
# tool from this repo's root Dockerfile, push all three to GHCR tagged by
# commit SHA, then SSH into the OCI server and recreate only the api/indexer
# containers. Postgres, Redis, and their volumes are never touched by this
# workflow -- see deploy/compose.yml's header comment and deploy/README.md.
#
# Typecheck/test/build validation happens upstream in ci.yml, both on the
# dev PR gate and again on every push to dev/staging, so this pipeline does
# not repeat it. A change only reaches `main` by a human merging the
# staging->main promotion PR (opened automatically by ci.yml), so by the
# time this workflow's push trigger fires, the change has already passed
# CI twice and been through review at both the staging and main gates.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & push ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            target: api
            app_arg: api
          - name: indexer
            target: indexer
            app_arg: indexer
          - name: migrator
            target: migrator
            app_arg: api
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="$(basename "${GITHUB_REPOSITORY,,}")"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"

      # QEMU registers binfmt_misc handlers so buildx can emulate arm64 on
      # this (amd64) runner; without it, cross-platform builds fail. Must
      # run before setup-buildx-action.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          # The OCI server is arm64; the runner is amd64. Building both in
          # one multi-platform manifest so `docker compose pull` on the
          # server resolves the right one automatically.
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP=${{ matrix.app_arg }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.owner }}/${{ steps.image.outputs.repo }}-${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.owner }}/${{ steps.image.outputs.repo }}-${{ matrix.name }}:production
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Verify multi-platform manifest
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ steps.image.outputs.owner }}/${{ steps.image.outputs.repo }}-${{ matrix.name }}:${{ github.sha }} \
            | grep -q 'linux/arm64'

          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ steps.image.outputs.owner }}/${{ steps.image.outputs.repo }}-${{ matrix.name }}:${{ github.sha }} \
            | grep -q 'linux/amd64'

  deploy:
    name: Deploy to OCI server
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="$(basename "${GITHUB_REPOSITORY,,}")"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"

      - name: Set up deploy SSH key
        run: |
          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "${{ secrets.OCI_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.OCI_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # Never syncs .env -- only compose.yml and the deploy scripts. rsync
      # --delete is scoped to deploy/scripts/ specifically so removing a
      # script from the repo removes it from the server too, without ever
      # touching anything else under /opt/apps/tagwise (in particular .env).
      - name: Sync compose file and deploy scripts (never .env)
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.OCI_SSH_USER }}@${{ secrets.OCI_HOST }}" \
            "mkdir -p /opt/apps/tagwise/deploy/scripts"
          rsync -az -e "ssh -i ~/.ssh/deploy_key" \
            deploy/compose.yml \
            "${{ secrets.OCI_SSH_USER }}@${{ secrets.OCI_HOST }}:/opt/apps/tagwise/compose.yml"
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            deploy/scripts/ \
            "${{ secrets.OCI_SSH_USER }}@${{ secrets.OCI_HOST }}:/opt/apps/tagwise/deploy/scripts/"

      - name: Run deploy.sh on the server
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.OCI_SSH_USER }}@${{ secrets.OCI_HOST }}" \
            "IMAGE_OWNER='${{ steps.image.outputs.owner }}' REPO_NAME='${{ steps.image.outputs.repo }}' IMAGE_TAG='${{ github.sha }}' GHCR_USER='${{ secrets.GHCR_USER }}' GHCR_TOKEN='${{ secrets.GHCR_TOKEN }}' bash /opt/apps/tagwise/deploy/scripts/deploy.sh"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
